name: Web Forms Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Web Forms solution
        shell: pwsh
        run: msbuild CodeRoom.sln /m /p:Configuration=Debug /p:Platform="Any CPU"

      - name: Build data-layer test harness
        shell: pwsh
        run: msbuild Tools/DataLayerTests/DataLayerTests.csproj /m /p:Configuration=Debug

      - name: Start LocalDB for acceptance tests
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Run data-layer acceptance tests
        shell: pwsh
        env:
          CODEROOM_TEST_CONNECTION_STRING: "Server=(LocalDB)\\MSSQLLocalDB;Database=CodeRoomDb;Integrated Security=True;Connect Timeout=30;MultipleActiveResultSets=True"
        run: .\\Tools\\DataLayerTests\\bin\\Debug\\DataLayerTests.exe
